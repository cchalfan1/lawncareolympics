name: Deploy

on:
  push:
    branches: [main]
  pull_request:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

# The VERCEL_TOKEN is project-scoped (created in the Vercel dashboard), which
# supports `vercel deploy` but not `vercel pull`/`whoami` — so we upload the
# source and let Vercel build it, rather than the pull/build/--prebuilt flow.
jobs:
  production:
    name: Production deploy
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Check credentials
        id: creds
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning title=Deploy skipped::VERCEL_TOKEN secret is not set (see README)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.creds.outputs.ready == 'true'

      - name: Deploy to Vercel (production)
        if: steps.creds.outputs.ready == 'true'
        run: |
          URL=$(npx vercel@latest deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }})
          echo "### 🚀 Production deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"

  preview:
    name: Preview deploy
    # Fork PRs don't receive secrets, so only deploy previews for same-repo PRs.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check credentials
        id: creds
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning title=Preview skipped::VERCEL_TOKEN secret is not set (see README)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.creds.outputs.ready == 'true'

      - name: Deploy to Vercel (preview)
        if: steps.creds.outputs.ready == 'true'
        run: |
          URL=$(npx vercel@latest deploy --yes --token=${{ secrets.VERCEL_TOKEN }})
          echo "### 🔍 Preview deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"
